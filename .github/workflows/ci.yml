name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./packages/hermes-auto ./packages/hermes-auto-todoist ./packages/hermes-auto-gmail ./packages/hermes-auto-proton pytest ruff build
      - run: ruff check .
      - run: pytest -q
      - run: for package in packages/*; do python -m build "$package" --outdir dist; done
      - uses: actions/upload-artifact@v6
        with:
          name: distributions-${{ matrix.python }}
          path: dist/*
