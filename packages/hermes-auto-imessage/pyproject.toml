[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
[project]
name = "hermes-auto-imessage"
version = "0.1.0"
description = "Hermes sessions for new iMessage/SMS messages on this Mac (sorter source, read-only)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Lukasz Piera"}]
dependencies = ["hermes-auto==0.1.0"]
[project.urls]
Repository = "https://github.com/pieralukasz/hermes-auto"
Issues = "https://github.com/pieralukasz/hermes-auto/issues"

[project.entry-points."hermes_auto.sources"]
imessage = "hermes_auto_imessage:Source"
