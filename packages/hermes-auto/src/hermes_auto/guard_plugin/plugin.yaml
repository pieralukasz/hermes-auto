name: hermes-auto-guard
version: "2.0.0"
description: "Read-only inbox bots of hermes-auto: the hermes-auto read toolset (one grammar-checked read command, raw skill reads) and a pre_tool_call guard that refuses every other tool in every session of the profile that enables it. Enable only in those bots' profiles."
author: Lukasz Piera
hooks:
  - pre_tool_call
provides_hooks:
  - pre_tool_call
provides_tools:
  - hermes_auto_read
  - hermes_auto_skill_view
  - hermes_auto_skills_list
