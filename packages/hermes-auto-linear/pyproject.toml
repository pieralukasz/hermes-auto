[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
[project]
name = "hermes-auto-linear"
version = "0.1.0"
description = "Hermes sessions for your Linear inbox (sorter source, read-only)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Lukasz Piera"}]
dependencies = ["hermes-auto==0.1.0"]
[project.urls]
Repository = "https://github.com/pieralukasz/hermes-auto"
Issues = "https://github.com/pieralukasz/hermes-auto/issues"

[project.entry-points."hermes_auto.sources"]
linear = "hermes_auto_linear:Source"
