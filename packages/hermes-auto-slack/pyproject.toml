[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
[project]
name = "hermes-auto-slack"
version = "0.1.0"
description = "Hermes sessions for Slack messages addressed to you (sorter source, read-only)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Lukasz Piera"}]
dependencies = ["hermes-auto==0.1.0", "requests>=2.32,<3"]
[project.urls]
Repository = "https://github.com/pieralukasz/hermes-auto"
Issues = "https://github.com/pieralukasz/hermes-auto/issues"

[project.entry-points."hermes_auto.sources"]
slack = "hermes_auto_slack:Source"
